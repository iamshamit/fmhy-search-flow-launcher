name: Publish Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get version
        id: version
        uses: notiz-dev/github-action-json-property@release
        with:
          path: 'plugin.json'
          prop_path: 'Version'

      - name: Install bundled dependencies
        shell: pwsh
        run: |
          if (Test-Path lib) { Remove-Item -LiteralPath lib -Recurse -Force }
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -t lib
          Get-ChildItem -Path lib -Recurse -Directory -Filter '__pycache__' |
            Remove-Item -Recurse -Force

      - name: Zip plugin
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.prop }}"
          $zip = "FMHY-Search-$version.zip"
          if (Test-Path $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path main.py, plugin.json, src, icons, lib -DestinationPath $zip -Force
          Get-Item $zip

      - name: Publish
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: 'FMHY-Search-${{steps.version.outputs.prop}}.zip'
          tag_name: 'v${{steps.version.outputs.prop}}'
          body: |
            ## What's New in v${{steps.version.outputs.prop}}

            ### New Features
            - **Keyword search by default** — all words must match, giving precise results with no noise. Mirrors the FMHY website's own search behaviour.
            - **Fuzzy search opt-in** — append `?` to any query for typo-tolerant matching (e.g. `fmhy qbittorent?` finds qBittorrent)
            - **Category picker** — type `fmhy cat:` to browse all categories; select one and press Enter to filter your search to that category
            - **Category + fuzzy composition** — filters and fuzzy mode work together: `fmhy cat:gaming emulater?`
            - **Zero-results fuzzy fallback** — when keyword search finds nothing, press Enter on the prompt to instantly retry as a fuzzy search

            ### Bug Fixes
            - **~1,900 missing entries restored** — FMHY lines listing multiple tools (e.g. `[Wox], [FlowLauncher], [Raycast]`) now index every tool, not just the first. FlowLauncher, Raycast, Listary and many others were previously unsearchable.
            - **Numbered mirror links removed** — `[2]`, `[3]`… alternate-URL entries no longer appear as junk results
            - **Multi-word category filters** — `cat:"Anime Streaming"` correctly scopes results to that subcategory
            - **Window stays open on action** — selecting a category or triggering fuzzy rewrite no longer closes Flow Launcher
            - **Query rewrite includes keyword** — history reruns and category selections now correctly stay within the `fmhy` plugin context

            ### Other
            - 88 tests (up from 69 in v1.0.0)
            - Updated README: `pm install FMHY Search by iamshamit` listed as primary installation method
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
