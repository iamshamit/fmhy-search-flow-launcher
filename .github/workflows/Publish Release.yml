name: Publish Release

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - .github/workflows/*

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get version
        id: version
        uses: notiz-dev/github-action-json-property@release
        with:
          path: 'plugin.json'
          prop_path: 'Version'

      - name: Install bundled dependencies
        shell: pwsh
        run: |
          if (Test-Path lib) { Remove-Item -LiteralPath lib -Recurse -Force }
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -t lib
          Get-ChildItem -Path lib -Recurse -Directory -Filter '__pycache__' |
            Remove-Item -Recurse -Force

      - name: Zip plugin
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.prop }}"
          $zip = "FMHY-Search-$version.zip"
          if (Test-Path $zip) { Remove-Item -LiteralPath $zip -Force }
          Compress-Archive -Path main.py, plugin.json, src, icons, lib -DestinationPath $zip -Force
          Get-Item $zip

      - name: Publish
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: 'FMHY-Search-${{steps.version.outputs.prop}}.zip'
          tag_name: 'v${{steps.version.outputs.prop}}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
